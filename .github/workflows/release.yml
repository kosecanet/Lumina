name: Release
# Publica una release al subir una etiqueta:  git tag v0.3.0 && git push origin v0.3.0
# Lumina (instalado) detecta la release, verifica checksums.txt y se actualiza solo.
on:
  push: { tags: ['v*'] }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Web compatible + binarios
        run: |
          npm i --no-save esbuild @webos-tools/cli
          node tools/legacy/build.mjs node_modules/.bin/esbuild
          go vet ./... && go test ./...
          ./build.sh "${GITHUB_REF_NAME}"
      - name: Cliente LG webOS (.ipk)
        continue-on-error: true
        run: |
          node_modules/.bin/ares-package clients/webos -o dist
          mv dist/*.ipk "dist/lumina-webos-${GITHUB_REF_NAME}.ipk"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cliente Android / Fire TV (.apk)
        continue-on-error: true
        working-directory: clients/android
        run: |
          # el runner ya trae el SDK de Android; solo se aceptan las licencias
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/lumina-android-${GITHUB_REF_NAME}.apk"
      - name: Sumas de verificación
        run: cd dist && rm -f checksums.txt && sha256sum lumina-linux-* lumina-windows-* > checksums.txt && cat checksums.txt
      - name: Publicar release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/lumina-* dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/lumina-* dist/checksums.txt --title "Lumina ${GITHUB_REF_NAME}" --generate-notes
          fi
