<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4f8f"/>
      <stop offset=".55" stop-color="#0d2a4f"/>
      <stop offset="1" stop-color="#070f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".2" r=".75">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#2a8cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2a8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".25" stop-color="#e6f6ff" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#9fdcff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9fdcff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ed8ff"/>
    </linearGradient>
    <radialGradient id="flare" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".35" stop-color="#d8f1ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="114"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- rayo de luz -->
  <path d="M8 40 L58 10 L470 470 L380 500 Z" fill="url(#beam)"/>
  <path d="M30 26 L42 20 L452 480 L428 488 Z" fill="#ffffff" fill-opacity=".22"/>
  <!-- play -->
  <path d="M204 160 Q204 132 228 146 L378 238 Q402 252 378 266 L228 358 Q204 372 204 344 Z" fill="url(#play)"/>
  <!-- destello -->
  <circle cx="200" cy="150" r="58" fill="url(#flare)" opacity=".85"/>
  <path d="M200 108 L205 145 L242 150 L205 155 L200 192 L195 155 L158 150 L195 145 Z" fill="#ffffff"/>
  </g>
</svg>
